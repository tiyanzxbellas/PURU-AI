<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PURU-AI Settings</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;padding:16px;max-width:480px;margin:0 auto}
h1{font-size:1.3rem;text-align:center;margin-bottom:16px;color:#38bdf8}
h2{font-size:1rem;margin:18px 0 8px;color:#94a3b8;border-bottom:1px solid #1e293b;padding-bottom:4px}
label{display:block;font-size:.82rem;color:#94a3b8;margin:10px 0 2px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid #334155;border-radius:6px;background:#1e293b;color:#e2e8f0;font-size:.9rem}
textarea{min-height:80px;resize:vertical}
.btn{display:inline-block;padding:9px 16px;border:none;border-radius:6px;font-size:.85rem;font-weight:600;cursor:pointer;margin:4px 4px 4px 0}
.btn-primary{background:#2563eb;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-success{background:#16a34a;color:#fff}
.btn-secondary{background:#334155;color:#94a3b8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:#1e293b;border-radius:8px;padding:12px;margin:10px 0}
.skill-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #0f172a;font-size:.85rem}
.skill-name{font-weight:600;color:#e2e8f0}
.skill-desc{font-size:.78rem;color:#64748b}
.msg{padding:8px 10px;border-radius:6px;font-size:.82rem;margin:8px 0;display:none}
.msg-ok{background:#064e3b;color:#34d399;display:block}
.msg-err{background:#7f1d1d;color:#fca5a5;display:block}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #e2e8f0;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.search-row{display:flex;gap:6px}
.search-row input{flex:1}
</style>
</head>
<body>
<h1>PURU-AI Settings</h1>
<div id="status" class="msg"></div>

<h2>API Configuration</h2>
<div class="card">
<label>Base URL</label>
<input id="baseUrl" placeholder="https://api.openai.com/v1">
<label>API Key</label>
<input id="apiKey" type="password" placeholder="sk-...">
<label>Model</label>
<input id="model" placeholder="gpt-4o">
<label>System Prompt / Role</label>
<textarea id="systemPrompt" placeholder="Kamu adalah asisten yang ramah..."></textarea>
<div style="margin-top:10px">
<button class="btn btn-primary" onclick="saveConfig()">Save</button>
<button class="btn btn-danger" onclick="clearConfig()">Clear All</button>
</div>
</div>

<h2>Skills</h2>
<div class="card">
<label>Search Skills</label>
<div class="search-row">
<input id="searchQuery" placeholder="keyword...">
<button class="btn btn-primary" onclick="searchSkills()">Search</button>
</div>
<div id="searchResults"></div>
</div>
<div class="card">
<label>Installed Skills</label>
<div id="installedSkills"><em style="color:#64748b">Loading...</em></div>
</div>

<div id="installTarget" style="display:none;position:fixed;top:0;left:0;right:0;background:#1e293b;padding:10px;border-bottom:1px solid #334155;z-index:10;text-align:center">
<span id="installMsg">Installing...</span>
</div>

<script>
const PATH=location.pathname.replace(/\/$/,'');
const API=PATH+'/api';

function showStatus(msg,ok){const el=document.getElementById('status');el.textContent=msg;el.className='msg '+(ok?'msg-ok':'msg-err');setTimeout(()=>{el.className='msg'},3000)}

async function loadConfig(){
try{
const r=await fetch(API+'/config');
if(!r.ok){showStatus('Failed to load config',false);return}
const d=await r.json();
document.getElementById('baseUrl').value=d.baseUrl||'';
document.getElementById('apiKey').value=''; // never show
document.getElementById('apiKey').placeholder=d.hasApiKey?'Current key set (leave empty to keep)':'sk-...';
document.getElementById('model').value=d.model||'';
document.getElementById('systemPrompt').value=d.systemPrompt||'';
}catch(e){showStatus('Network error: '+e.message,false)}
}

async function saveConfig(){
const body={};
const u=document.getElementById('baseUrl').value.trim();
const k=document.getElementById('apiKey').value.trim();
const m=document.getElementById('model').value.trim();
const s=document.getElementById('systemPrompt').value.trim();
if(u)body.baseUrl=u;
if(k)body.apiKey=k;
if(m)body.model=m;
body.systemPrompt=s;
try{
const r=await fetch(API+'/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
const d=await r.json();
if(d.ok){showStatus('Settings saved!',true);loadConfig()}
else showStatus(d.error||'Save failed',false)
}catch(e){showStatus('Network error: '+e.message,false)}
}

async function clearConfig(){
if(!confirm('Hapus semua pengaturan API?'))return;
try{
const r=await fetch(API+'/config/clear',{method:'POST'});
const d=await r.json();
if(d.ok){showStatus('Settings cleared.',true);loadConfig()}
else showStatus(d.error||'Failed',false)
}catch(e){showStatus('Network error: '+e.message,false)}
}

async function loadSkills(){
try{
const r=await fetch(API+'/skills/list');
const d=await r.json();
const el=document.getElementById('installedSkills');
if(!d.skills||d.skills.length===0){el.innerHTML='<em style="color:#64748b">No skills installed.</em>';return}
el.innerHTML=d.skills.map(s=>'<div class="skill-item"><div><span class="skill-name">'+esc(s.name)+'</span><br><span class="skill-desc">'+esc(s.description||'')+'</span></div><button class="btn btn-danger" style="padding:4px 8px;font-size:.75rem" onclick="deleteSkill(\''+esc(s.name)+'\')">Delete</button></div>').join('')
}catch(e){document.getElementById('installedSkills').innerHTML='<em style="color:#64748b">Failed to load.</em>'}
}

async function searchSkills(){
const q=document.getElementById('searchQuery').value.trim();
if(!q){return}
const el=document.getElementById('searchResults');
el.innerHTML='<span class="spinner"></span> Searching...';
try{
const r=await fetch(API+'/skills/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});
const d=await r.json();
if(!d.results||d.results.length===0){el.innerHTML='<p style="color:#64748b;font-size:.82rem">No results.</p>';return}
el.innerHTML=d.results.slice(0,10).map(r=>'<div class="skill-item"><div><span class="skill-name">'+esc(r.displayName||r.slug)+'</span><br><span class="skill-desc">'+esc((r.summary||'').substring(0,100))+' <code>['+esc(r.registry||'')+']</code></span></div><button class="btn btn-success" style="padding:4px 8px;font-size:.75rem" onclick="installSkill(\''+esc(r.target)+'\')">Install</button></div>').join('')
}catch(e){el.innerHTML='<p style="color:#f87171;font-size:.82rem">Search failed.</p>'}
}

async function installSkill(target){
const el=document.getElementById('installTarget');
const msg=document.getElementById('installMsg');
el.style.display='block';msg.textContent='Installing '+target+'...';
try{
const r=await fetch(API+'/skills/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target})});
const d=await r.json();
el.style.display='none';
if(d.ok){showStatus('Skill "'+d.name+'" installed!',true);loadSkills()}
else showStatus('Install failed: '+(d.error||'unknown'),false)
}catch(e){el.style.display='none';showStatus('Network error: '+e.message,false)}
}

async function deleteSkill(name){
if(!confirm('Delete skill "'+name+'"?'))return;
try{
const r=await fetch(API+'/skills/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
const d=await r.json();
if(d.ok){showStatus('Skill "'+name+'" deleted.',true);loadSkills()}
else showStatus(d.error||'Delete failed',false)
}catch(e){showStatus('Network error: '+e.message,false)}
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

document.addEventListener('DOMContentLoaded',()=>{loadConfig();loadSkills()});
</script>
</body>
</html>
